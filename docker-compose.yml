services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: netbot
      POSTGRES_PASSWORD: netbot
      POSTGRES_DB: netbot
    ports:
      - "5432:5432"
    volumes:
      - netbot_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - netbot_redis_data:/data

volumes:
  netbot_postgres_data:
  netbot_redis_data:
